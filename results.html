<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Results - INSYD</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --primary: #a8c7fa;
            --text: #e3e3e3;
            --text-muted: #9ca3af;
            --border: #222222;
            --good: #4ade80;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            color: var(--primary);
        }

        .tagline {
            color: var(--text-muted);
            margin: 0;
            font-size: 0.95rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.5rem;
        }

        .card h2 {
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
            color: var(--primary);
        }

        .stat-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .stat-row:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .stat-label {
            flex: 0 0 35%;
            font-size: 0.9rem;
        }

        .stat-bar {
            flex: 1;
            height: 22px;
            background: #1a1a1c;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .stat-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), #7ba3d1);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #000;
            transition: width 0.4s ease;
            min-width: 0;
        }

        .stat-count {
            flex: 0 0 40px;
            text-align: right;
            font-weight: 600;
            color: var(--good);
            font-size: 0.9rem;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .metric-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        @media (max-width: 768px) {
            .metric-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .metric-box {
            background: #1a1a1c;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
        }

        .metric-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0.5rem 0;
        }

        .metric-label {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-muted);
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover { text-decoration: underline; }

        .note {
            background: rgba(168, 199, 250, 0.08);
            border-left: 3px solid var(--primary);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .note p { margin: 0; }

        .total-responses {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="back-link">← Back to survey</a>

    <header>
        <h1>Survey Results</h1>
        <p class="tagline">Anonymous feedback from NSW students • Live data</p>
    </header>

    <div class="note">
        <p><strong>📊 Anonymous only:</strong> We show aggregate data and trends only—no personal information. Results update as students respond.</p>
    </div>

    <div id="content"></div>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        Loading survey data...
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyA6X4hzHQc5dPfaKxL2tMvKlNpQrStBhPw",
        authDomain: "insyd-career-matchmaker.firebaseapp.com",
        projectId: "insyd-career-matchmaker",
        storageBucket: "insyd-career-matchmaker.appspot.com",
        messagingSenderId: "987654321098",
        appId: "1:987654321098:web:a1b2c3d4e5f6g7h8"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    async function loadResults() {
        const loading = document.getElementById('loading');
        const content = document.getElementById('content');

        try {
            const snapshot = await db.collection('survey-responses').get();
            const responses = snapshot.docs.map(doc => doc.data());
            
            if (responses.length === 0) {
                content.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No survey responses yet. Take the survey to get started!</p>';
                loading.style.display = 'none';
                return;
            }

            const stats = processData(responses);
            renderResults(stats);
            loading.style.display = 'none';

        } catch (error) {
            console.error('Error loading results:', error);
            content.innerHTML = '<p style="color: #ff9e9e;">Error loading survey data. Check your connection.</p>';
            loading.style.display = 'none';
        }
    }

    function processData(responses) {
        const stats = {
            total: responses.length,
            years: {},
            interests: {},
            goals: {},
            barriers: {},
            policy: {},
            cert4: {},
            locations: {}
        };

        responses.forEach(r => {
            // Year
            if (r.year) stats.years[r.year] = (stats.years[r.year] || 0) + 1;

            // Interests
            if (r.interests && Array.isArray(r.interests)) {
                r.interests.forEach(i => {
                    stats.interests[i] = (stats.interests[i] || 0) + 1;
                });
            }

            // Goals
            if (r.goal) stats.goals[r.goal] = (stats.goals[r.goal] || 0) + 1;

            // Barriers
            if (r.barriers && Array.isArray(r.barriers)) {
                r.barriers.forEach(b => {
                    stats.barriers[b] = (stats.barriers[b] || 0) + 1;
                });
            }

            // Policy
            if (r.policy) stats.policy[r.policy] = (stats.policy[r.policy] || 0) + 1;

            // Cert IV
            if (r.wouldTakeCert4) stats.cert4[r.wouldTakeCert4] = (stats.cert4[r.wouldTakeCert4] || 0) + 1;

            // Locations
            if (r.location) stats.locations[r.location] = (stats.locations[r.location] || 0) + 1;
        });

        return stats;
    }

    function renderResults(stats) {
        const html = `
            <div class="grid">
                <div class="card">
                    <h2>📚 Year Groups</h2>
                    ${renderStats(stats.years, stats.total)}
                </div>

                <div class="card">
                    <h2>🎯 Post-School Goals</h2>
                    ${renderGoalsStats(stats.goals, stats.total)}
                </div>

                <div class="card">
                    <h2>💼 Main Interests</h2>
                    ${renderStats(stats.interests, stats.total)}
                </div>

                <div class="card">
                    <h2>🚧 Barriers to Pursuing Goals</h2>
                    ${renderStats(stats.barriers, stats.total, true)}
                </div>

                <div class="card full-width">
                    <h2>📢 Should NSW Allow Cert IV Apprenticeships?</h2>
                    <div class="metric-grid">
                        <div class="metric-box">
                            <div class="metric-label">Yes, Definitely</div>
                            <div class="metric-value">${percent(stats.policy['yes'] || 0, stats.total)}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${stats.policy['yes'] || 0} votes</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Maybe / Unsure</div>
                            <div class="metric-value">${percent(stats.policy['maybe'] || 0, stats.total)}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${stats.policy['maybe'] || 0} votes</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">No</div>
                            <div class="metric-value">${percent(stats.policy['no'] || 0, stats.total)}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${stats.policy['no'] || 0} votes</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Total Votes</div>
                            <div class="metric-value">${stats.total}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">responses</div>
                        </div>
                    </div>
                </div>

                <div class="card full-width">
                    <h2>🎓 Would You Take ICT40120 (Cert IV in IT)?</h2>
                    <div class="metric-grid">
                        <div class="metric-box">
                            <div class="metric-label">Yes, Interested</div>
                            <div class="metric-value">${percent(stats.cert4['yes'] || 0, stats.total)}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${stats.cert4['yes'] || 0} students</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Maybe</div>
                            <div class="metric-value">${percent(stats.cert4['maybe'] || 0, stats.total)}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${stats.cert4['maybe'] || 0} students</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Not Interested</div>
                            <div class="metric-value">${percent(stats.cert4['no'] || 0, stats.total)}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">${stats.cert4['no'] || 0} students</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-label">Interested (Combined)</div>
                            <div class="metric-value">${percent((stats.cert4['yes'] || 0) + (stats.cert4['maybe'] || 0), stats.total)}</div>
                            <div style="font-size: 0.8rem; color: var(--text-muted);">yes + maybe</div>
                        </div>
                    </div>
                </div>

                <div class="card full-width">
                    <h2>📍 Where Are Students From?</h2>
                    ${renderStats(stats.locations, stats.total, true)}
                </div>
            </div>

            <div class="total-responses">
                <strong>${stats.total}</strong> students have taken the survey
                <br><small>Data updates in real-time</small>
            </div>
        `;
        document.getElementById('content').innerHTML = html;
    }

    function renderStats(obj, total, allowsMultiple = false) {
        const sorted = Object.entries(obj).sort((a, b) => b[1] - a[1]);
        const topItems = sorted.slice(0, 8);

        return topItems.map(([label, count]) => {
            const pct = Math.round((count / total) * 100);
            const divisor = allowsMultiple ? (total * 0.5) : total;
            const barWidth = Math.round((count / divisor) * 100);
            return `
                <div class="stat-row">
                    <div class="stat-label">${label}</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" style="width: ${barWidth}%">
                            ${barWidth > 10 ? pct + '%' : ''}
                        </div>
                    </div>
                    <div class="stat-count">${count}</div>
                </div>
            `;
        }).join('');
    }

    function renderGoalsStats(obj, total) {
        const labels = {
            'uni': 'University',
            'trade': 'Apprenticeship/Traineeship',
            'work': 'Straight to Work',
            'unsure': 'Not Sure Yet'
        };

        return Object.entries(labels).map(([key, label]) => {
            const count = obj[key] || 0;
            const pct = Math.round((count / total) * 100);
            const barWidth = Math.round((count / total) * 100);
            return `
                <div class="stat-row">
                    <div class="stat-label">${label}</div>
                    <div class="stat-bar">
                        <div class="stat-bar-fill" style="width: ${barWidth}%">
                            ${barWidth > 10 ? pct + '%' : ''}
                        </div>
                    </div>
                    <div class="stat-count">${count}</div>
                </div>
            `;
        }).join('');
    }

    function percent(count, total) {
        if (total === 0) return '0%';
        return Math.round((count / total) * 100) + '%';
    }

    loadResults();

    // Reload every 10 seconds
    setInterval(loadResults, 10000);
</script>

</body>
</html>
